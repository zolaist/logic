services:
  mariadb:
    image: mariadb:11
    environment:
      MARIADB_DATABASE: logic_app
      MARIADB_USER: logic_app
      MARIADB_PASSWORD: logic_app_password
      MARIADB_ROOT_PASSWORD: root_password
    ports:
      - "3306:3306"
    volumes:
      - logic_mariadb_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  logic_mariadb_data:
